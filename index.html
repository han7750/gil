<!--
  ============================================================
  길 (Gil) v2.0  —  소상공인 광고 영상 제작 대행

  [문이 3개입니다]
  ① 앞문 (사장님)  : 설명 적고 신청 → 신청서를 카톡으로 보냄
  ② 운영실 (사장님 눈에 안 띔) : 신청서 받기 → 지시문 → 클로드 결과 → 결과 링크 만들기
  ③ 결과 문 (사장님) : 받은 링크를 열면 제작안이 펼쳐짐

  [왜 이렇게 나눴나]
  브라우저에서 직접 AI를 부를 수 없고, 열쇠를 코드에 넣으면 누구나 꺼내 씁니다.
  게다가 납기가 3시간~2일이므로 원래부터 사람이 중간에 들어가는 구조입니다.
  사장님은 지시문·클로드·붙여넣기를 절대 보지 않습니다.

  [나중에 서버를 붙이면]
  운영실의 지시문 만들기·결과 받기만 서버 호출로 바꾸면 됩니다.
  사장님 화면(앞문·결과 문)은 그대로 씁니다.
  ============================================================
-->

<style>
:root{
  --road:#0B3B2A; --road2:#10553C; --panel:#0E4732; --edge:#1B6A4C;
  --accent:#F2C230; --accent-ink:#F2C230; --paper:#F7FAF5; --mute:#93B7A3;
  --spine:#082B1F; --field:#082B1F; --danger:#FF9B6A; --good:#5FD48A;
  --disp:"Black Han Sans","HY헤드라인M","HY견고딕","Malgun Gothic","맑은 고딕",
         "Apple SD Gothic Neo",system-ui,sans-serif;
  --body:"Gothic A1","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",
         system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"Consolas","D2Coding","Menlo",monospace;
}
@media (prefers-color-scheme:light){
  :root{ --road:#F4F6F1; --road2:#EAF0E7; --panel:#FFFFFF; --edge:#CBDCD0;
    --accent-ink:#8A6410; --paper:#0B3B2A; --mute:#5C7A69;
    --spine:#0B3B2A; --field:#FFFFFF; --danger:#B4491B; --good:#1E7A44; }
}
:root[data-theme="light"]{
  --road:#F4F6F1; --road2:#EAF0E7; --panel:#FFFFFF; --edge:#CBDCD0;
  --accent-ink:#8A6410; --paper:#0B3B2A; --mute:#5C7A69;
  --spine:#0B3B2A; --field:#FFFFFF; --danger:#B4491B; --good:#1E7A44;
}
:root[data-theme="dark"]{
  --road:#0B3B2A; --road2:#10553C; --panel:#0E4732; --edge:#1B6A4C;
  --accent-ink:#F2C230; --paper:#F7FAF5; --mute:#93B7A3;
  --spine:#082B1F; --field:#082B1F; --danger:#FF9B6A; --good:#5FD48A;
}

*{box-sizing:border-box;}
/* 페이지 맨 밑바닥까지 도로 색으로 칠합니다.
   이걸 안 하면 화면을 아래로 내렸을 때 바탕의 흰색이 드러납니다.
   글자 색도 함께 정해 둬야 밝은 화면·어두운 화면 어디서든 안 깨집니다. */
html,body{margin:0; padding:0; background:var(--road); color:var(--paper);}
/* 스크롤 막대까지 화면 밝기에 맞춥니다. 안 맞추면 막대만 하얗게 튑니다.
   위쪽 색 정의와 똑같은 차례로 둡니다 — 기본 어두움 → 밝은 화면 → 직접 고른 값 */
html{color-scheme:dark;}
@media (prefers-color-scheme:light){ html{color-scheme:light;} }
:root[data-theme="dark"]{color-scheme:dark;}
:root[data-theme="light"]{color-scheme:light;}
.gil{min-height:100vh; background:var(--road); color:var(--paper);
     font-family:var(--body); -webkit-font-smoothing:antialiased; line-height:1.6;}
.wrap{max-width:520px; margin:0 auto; min-height:100vh; position:relative;
      padding:0 20px 64px 46px;}
.spine{position:absolute; left:14px; top:0; bottom:0; width:14px; background:var(--spine);}
.dash{position:absolute; left:5px; top:0; width:4px; height:200%;
  background:repeating-linear-gradient(to bottom,var(--accent) 0 26px,transparent 26px 52px);}
.dash.run{animation:drive 1.1s linear infinite;}
@keyframes drive{from{transform:translateY(0)} to{transform:translateY(-52px)}}
@media (prefers-reduced-motion:reduce){.dash.run{animation:none}}

.disp{font-family:var(--disp); font-weight:900; letter-spacing:-.03em; text-wrap:balance;}
.eyebrow{font-size:11px; letter-spacing:.22em; color:var(--mute); font-weight:800;}
.h1{font-size:68px; line-height:.92; margin:6px 0 0;}
.h2{font-size:27px; line-height:1.22; margin:8px 0 6px;}
.sub{color:var(--mute); font-size:14px; margin:0;}
.lead{color:var(--paper); font-size:16px; margin:0;}

.card{background:var(--panel); border:1px solid var(--edge); border-radius:2px; padding:16px;}
.stack{display:flex; flex-direction:column; gap:12px;}
.row{display:flex; gap:8px; flex-wrap:wrap;}

.opt{width:100%; text-align:left; background:var(--panel); border:1px solid var(--edge);
  border-radius:2px; padding:16px; color:var(--paper); cursor:pointer; font-family:inherit;
  display:flex; gap:14px; align-items:flex-start; transition:border-color .15s,background .15s;}
.opt:hover{border-color:var(--accent);}
.opt[aria-pressed="true"]{border-color:var(--accent); background:var(--road2);}
.dot{width:18px; height:18px; border-radius:50%; border:2px solid var(--mute); margin-top:3px; flex:none;}
.opt[aria-pressed="true"] .dot{border-color:var(--accent); background:var(--accent);
  box-shadow:inset 0 0 0 3px var(--road2);}
.optName{font-family:var(--disp); font-weight:900; font-size:18px;}
.price{font-size:12px; color:var(--accent-ink); font-weight:800; margin-top:2px;}
/* 잠긴 등급 — 누를 수 없고, 실패가 아니라 '아직 안 연 문'으로 보이게 합니다 */
.opt.lock{cursor:not-allowed; opacity:.5;}
.opt.lock:hover{border-color:var(--edge);}
.opt.lock .dot{border-style:dashed; background:none; box-shadow:none;}
.lockprice{color:var(--mute) !important;}
.note{font-size:12px; color:var(--mute); margin-top:4px;}

.btn{width:100%; background:var(--accent); color:#0B3B2A; border:0; border-radius:2px;
  padding:16px; font-family:var(--disp); font-weight:900; font-size:19px; cursor:pointer;
  min-height:56px;}
.btn:hover{filter:brightness(1.06);}
.btn:disabled{background:var(--road2); color:var(--mute); cursor:not-allowed; filter:none;}
.btn.done{background:var(--good); color:#04220F;}
.ghost{width:100%; background:none; border:1px solid var(--edge); color:var(--mute);
  border-radius:2px; padding:12px 14px; font-size:13px; font-weight:800; cursor:pointer;
  font-family:inherit; min-height:46px;}
.ghost:hover{border-color:var(--accent); color:var(--paper);}
.ghost.done{border-color:var(--good); color:var(--good);}
.mini{width:auto; padding:8px 12px; font-size:12px; min-height:38px; flex:0 0 auto;}
/* 링크를 버튼처럼 보이게 — 글자가 가운데 오도록 */
.linkbtn{display:flex; align-items:center; justify-content:center; text-decoration:none;
  box-sizing:border-box;}
a.btn.linkbtn{color:#0B3B2A;}
a.ghost.linkbtn{color:var(--mute);}
a.ghost.linkbtn:hover{color:var(--paper);}
/* 복사할 글자 한 줄 */
.copyrow{display:flex; align-items:center; gap:10px;}
.copyval{flex:1 1 auto; font-family:var(--mono); font-size:12.5px; word-break:break-all;
  color:var(--paper);}
.tiny{background:none; border:0; color:var(--mute); font-size:11px; cursor:pointer;
  font-family:inherit; padding:8px; opacity:.55;}
.tiny:hover{opacity:1; color:var(--accent-ink);}

textarea,input[type=text]{width:100%; background:var(--field); border:1px solid var(--edge);
  color:var(--paper); border-radius:2px; padding:14px; font-size:15px; font-family:inherit;
  resize:vertical; line-height:1.6;}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.mono{font-family:var(--mono); font-size:12.5px; line-height:1.65;}

.chips{display:flex; gap:8px; flex-wrap:wrap;}
.chip{background:var(--panel); border:1px solid var(--edge); color:var(--paper);
  border-radius:999px; padding:9px 16px; cursor:pointer; font-family:inherit; font-size:14px;
  min-height:42px;}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#0B3B2A;
  font-weight:800;}

.tabs{display:flex; border-bottom:1px solid var(--edge); overflow-x:auto;}
.tabs button{flex:0 0 auto; background:none; border:0; border-bottom:3px solid transparent;
  color:var(--mute); padding:12px 14px; font-family:inherit; font-size:14px; font-weight:800;
  cursor:pointer; min-height:48px; white-space:nowrap;}
.tabs button[aria-selected="true"]{color:var(--paper); border-bottom-color:var(--accent);}

.cut{display:grid; grid-template-columns:64px 1fr; gap:12px; padding:14px 0;
  border-top:1px dashed var(--edge);}
.cut:first-child{border-top:0;}
.time{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--accent-ink);
  font-size:12.5px; font-weight:700;}
.visual{font-size:14.5px;}
.shot{font-size:12.5px; color:var(--mute); margin-top:4px;}
.capt{font-size:13.5px; color:var(--accent-ink); margin-top:6px; font-weight:700;}
.voice{font-size:13px; margin-top:4px; opacity:.85;}
.num{font-family:var(--disp); font-weight:900; color:var(--accent-ink); font-size:13px;}
.tag{display:inline-block; border:1px solid var(--edge); color:var(--mute); padding:5px 9px;
  font-size:12px; margin:0 6px 6px 0;}
.step{display:grid; grid-template-columns:26px 1fr; gap:10px; padding:9px 0;
  border-top:1px dashed var(--edge); font-size:14px;}
.step:first-child{border-top:0;}
.plate{border:2px solid var(--paper); border-radius:6px; padding:8px 18px; display:inline-block;
  font-family:var(--disp); font-weight:900; font-size:30px; line-height:1;}
.warn{color:var(--danger); font-size:13px;}
.okmsg{color:var(--good); font-size:13px;}
.top{position:absolute; right:20px; top:20px; display:flex; gap:4px; z-index:2;}
.top button{background:none; border:1px solid var(--edge); color:var(--mute); font-size:11px;
  padding:6px 9px; cursor:pointer; font-weight:800; font-family:inherit;}
.top button[aria-pressed="true"]{background:var(--accent); color:#0B3B2A; border-color:var(--accent);}
.opbar{background:var(--road2); border:1px solid var(--accent); padding:8px 12px;
  font-size:11px; font-weight:800; color:var(--accent-ink); letter-spacing:.1em;
  margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
[hidden]{display:none !important;}
</style>

function t(k){ return T[S.lang][k]; }
/* 낱말 안의 {a} {b} {n} 자리에 값을 끼워 넣습니다 */
function tf(k, vals){
  var s = t(k);
  Object.keys(vals || {}).forEach(function(x){
    s = s.split("{" + x + "}").join(String(vals[x]));
  });
  return s;
}

/* =========================================================
   ★ 여기만 채우면 됩니다 — 사장님이 신청서를 보낼 곳 ★

   [어느 것이 남에게 덜 보이나]

   ① 1:1 오픈채팅  — 가장 안전합니다.
      들어오는 사람마다 각자 다른 방이 열립니다. 서로의 대화를 볼 수 없습니다.
      구경만 할 수 있는 '홈 화면'이 없어서 남이 기웃거릴 곳도 없습니다.
      내 실명·전화번호도 드러나지 않습니다.
      만드는 법: 카카오톡 → 채팅 → 오픈채팅 → + → 1:1 채팅방 만들기 → 링크 복사

   ② 카카오톡 채널 — 대화 자체는 1:1이라 남이 볼 수 없습니다.
      다만 '채널 홈'이 공개라 누구나 들어와 게시글과 친구 수를 볼 수 있습니다.
      대화 내용은 절대 안 보입니다.

   ③ 전화번호 — 공개하면 스팸이 옵니다. 꼭 필요할 때만 쓰세요.

   빈 칸("")으로 두면 그 줄은 화면에 아예 나오지 않습니다.
   ========================================================= */
var CONTACT_DEFAULT = {
  // 지금은 카카오톡 채널 「road」를 씁니다. 끝을 /chat 으로 둡니다.
  // /friend 는 친구추가 화면으로 가고, /chat 은 채팅창이 바로 열려
  // 사장님이 복사한 신청서를 그 자리에서 붙여넣을 수 있습니다.
  //
  // 채널 홈을 남에게 보이고 싶지 않다면, 1:1 오픈채팅 링크를 만들어
  // 이 줄을 그 링크로 바꾸면 됩니다. 운영실 → 연락처 에서도 바꿀 수 있습니다.
  kakaoOpen : "https://pf.kakao.com/_uUxbBX/chat",
  kakaoId   : "",
  phone     : "",
  email     : "",

  /* 외국인 사장님용 — 영어 화면에서 먼저 보여줍니다.
     카카오톡을 안 쓰는 분이 많아서, 카톡만 걸어두면 신청할 방법이 없습니다.

     - instagram : 인스타그램 아이디. @ 없이 아이디만 적으세요.
                   디엠 창이 바로 열립니다.
     - email     : 위 email 칸을 함께 씁니다.
                   공개하면 스팸이 오니, 따로 만든 주소를 쓰는 편이 낫습니다. */
  instagram : ""
};
var CKEY = "gil.contact";

/* =========================================================
   ★ 이 사이트의 '진짜 주소' ★

   결과 링크는 "사이트 주소 + #r=암호코드" 로 만듭니다.
   그런데 클로드 아티팩트처럼 액자(iframe) 안에서 열리는 곳에서는
   화면 스스로 바깥 주소를 알아낼 방법이 없습니다.
   그래서 여기에 손으로 적어 둡니다.

   - 비워 두면("") 결과 링크 버튼이 아예 안 나옵니다. 결과 코드만 씁니다.
   - 나중에 깃허브 페이지·넷리파이 같은 곳에 올리면
     그때 주소를 여기에 적으세요. 그 순간부터 링크가 살아납니다.
     예) 내이름.github.io/gil/ 를 쓴다면 그 주소를 그대로 적으면 됩니다
   ========================================================= */
var SITE_URL = "https://han7750.github.io/gil/";

/* 액자 안에서 열렸는지 확인합니다.
   액자 안이면 바깥 주소의 # 뒷부분이 전달되지 않아 링크 방식을 못 씁니다. */
function inFrame(){
  try{ return window.self !== window.top; }catch(e){ return true; }
}
/* 결과 링크에 쓸 바탕 주소를 정합니다. 못 정하면 빈 칸을 돌려줍니다. */
function siteBase(){
  if(SITE_URL) return SITE_URL.replace(/#.*$/,"");
  if(inFrame()) return "";                      // 액자 안 → 링크 못 만듦
  try{ return location.origin + location.pathname; }catch(e){ return ""; }
}

/* 이 컴퓨터에 따로 저장해 둔 값이 있으면 그것을 쓰고,
   비어 있는 칸은 위에 적어 둔 기본값으로 채웁니다.
   → 운영실에서 실수로 빈 칸을 저장해도 사장님 화면의 연락처가 사라지지 않습니다. */
function loadContact(){
  var d = null;
  try{ d = JSON.parse(localStorage.getItem(CKEY) || "null"); }catch(e){}
  var pick = function(k){ return (d && d[k]) ? d[k] : (CONTACT_DEFAULT[k] || ""); };
  return { kakaoOpen:pick("kakaoOpen"), kakaoId:pick("kakaoId"),
           phone:pick("phone"), email:pick("email"),
           instagram:pick("instagram") };
}

/* 고른 말(한국어/영어)을 기억합니다.
   외국인 사장님이 다시 들어왔을 때 또 EN 을 누르게 하면 안 됩니다. */
var GKEY = "gil.lang";
function loadLang(){
  try{
    var v = localStorage.getItem(GKEY);
    if(v === "ko" || v === "en") return v;
  }catch(e){}
  /* 저장된 게 없으면 브라우저 말을 따릅니다. 한국어가 아니면 영어로 엽니다. */
  try{

  }catch(e){}
  return "ko";
}

var LKEY = "gil.ledger";
var LEDGER_MAX = 300;              // 너무 쌓이면 저장 공간이 넘칩니다

function loadLedger(){
  try{
    var a = JSON.parse(localStorage.getItem(LKEY) || "[]");
    return Array.isArray(a) ? a : [];
  }catch(e){ return []; }
}
function saveLedger(list){
  try{ localStorage.setItem(LKEY, JSON.stringify(list)); return true; }
  catch(e){ return false; }        // 저장 공간이 꽉 찼을 때
}
/* 새 건을 맨 위에 넣습니다. 저장에 실패하면 false 를 돌려줍니다. */
function addLedger(rec){
  var list = loadLedger();
  list.unshift(rec);
  if(list.length > LEDGER_MAX) list = list.slice(0, LEDGER_MAX);
  return saveLedger(list);
}
function removeLedger(id){
  return saveLedger(loadLedger().filter(function(x){ return x.id !== id; }));
}
/* 백업을 불러올 때 씁니다. 같은 건은 한 번만 들어갑니다. */
function mergeLedger(incoming){
  var now = loadLedger(), seen = {}, out = [];
  now.forEach(function(x){ seen[x.id] = true; });
  var added = 0;
  incoming.forEach(function(x){
    if(!x || !x.id || seen[x.id]) return;
    seen[x.id] = true; now.push(x); added++;
  });
  now.sort(function(a,b){ return (b.at || 0) - (a.at || 0); });
  out = now.slice(0, LEDGER_MAX);
  return saveLedger(out) ? added : -1;
}
/* 날짜를 사람이 읽는 말로 바꿉니다 */
function whenText(ms){
  var d = new Date(ms || 0);
  if(isNaN(d.getTime())) return "날짜 모름";
  var h24 = d.getHours();
  var ampm = h24 < 12 ? "오전" : "오후";
  var h12 = h24 % 12; if(h12 === 0) h12 = 12;
  var mm = String(d.getMinutes());
  if(mm.length < 2) mm = "0" + mm;
  return (d.getMonth()+1) + "월 " + d.getDate() + "일 " + ampm + " " + h12 + ":" + mm;
}

var LENGTHS = [
  { v:"30", ko:"30초",     en:"30 sec", cuts:5  },

];
function lenOf(sec){
  var s = String(sec || "");
  for(var i=0;i<LENGTHS.length;i++) if(LENGTHS[i].v === s) return LENGTHS[i];

}

/* 한국어 신청서와 영어 신청서를 둘 다 읽어냅니다.
   외국인 사장님이 보낸 신청서인지 여기서 알아내고, 그 사실을 lang 에 담아
   클로드 지시문과 결과 글까지 같은 말로 나가게 합니다. */
function readSheet(text){
  var s = String(text || "");
  var en = s.indexOf("[GIL REQUEST]") >= 0;
  if(!en && s.indexOf("[길 신청서]") < 0) return null;

  var get = function(re){ var m = s.match(re); return m ? m[1].trim() : ""; };
  var due = en ? get(/Due:\s*(.+)/) : get(/납기:\s*(.+)/);
  var tier = /3시간|3 hour/i.test(due) ? "fast"
           : (/1일|1 day/i.test(due) ? "d1" : "d2");

  /* "길이: 60초 (1분)" / "Length: 60 sec (1 min)" 에서 60 을 집어냅니다.
     목록에 없는 숫자가 오면 가장 가까운 길이로 맞춥니다. */
  var raw = (en ? get(/Length:\s*(\d+)/) : get(/길이:\s*(\d+)/)) || "30";
  var sec = lenOf(raw).v;
  if(sec !== raw){
    var n = Number(raw), best = LENGTHS[0], gap = Infinity;
    LENGTHS.forEach(function(L){
      var d = Math.abs(Number(L.v) - n);
      if(d < gap){ gap = d; best = L; }
    });
    sec = best.v;
  }

  var who = en ? get(/Contact:\s*(.+)/) : get(/연락처:\s*(.+)/);
  var mark = en ? "About:" : "설명:";
  var bi = s.indexOf(mark);
  var brief = bi < 0 ? "" : s.slice(bi + mark.length).trim();
  if(!brief) return null;
  return { tier:tier, sec:sec, who:who, brief:brief, lang:(en ? "en" : "ko") };
}

/* =========================================================
   5) 결과를 링크·코드로 바꾸기
      브라우저에 내장된 압축을 쓰고, 없으면 그냥 담습니다.
   ========================================================= */
function b64url(bytes){
  var s = "";
  for(var i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unb64url(str){
  var s = String(str).replace(/-/g,"+").replace(/_/g,"/");
  while(s.length % 4) s += "=";
  var bin = atob(s), out = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
/* 결과를 작게 줄입니다. 줄이면 코드가 짧아져 카톡에서 잘릴 위험이 줄어듭니다.
   앞에 한 글자를 붙여 '줄였는지(z)' '그냥 담았는지(p)' 표시해 둡니다. */
function squeeze(obj){
  var bytes = new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){
    try{
      var st = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
      return new Response(st).arrayBuffer().then(function(buf){
        return { flag:"z", bytes:new Uint8Array(buf) };
      }).catch(function(){ return { flag:"p", bytes:bytes }; });
    }catch(e){}
  }
  return Promise.resolve({ flag:"p", bytes:bytes });
}
function unsqueeze(flag, bytes){
  var toObj = function(u8){
    try{ return JSON.parse(new TextDecoder().decode(u8)); }catch(e){ return null; }
  };
  if(flag === "z" && window.DecompressionStream){
    try{
      var st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return new Response(st).arrayBuffer()
        .then(function(buf){ return toObj(new Uint8Array(buf)); })
        .catch(function(){ return null; });
    }catch(e){ return Promise.resolve(null); }
  }
  if(flag === "p") return Promise.resolve(toObj(bytes));
  return Promise.resolve(null);
}

/* =========================================================
   자물쇠 — 열쇠번호 4자리로 결과를 잠급니다

   왜 필요한가:
   결과 코드는 그 자체로 내용을 다 담고 있습니다.
   잠그지 않으면 코드를 주운 사람이 사장님 가게 이야기를 그대로 볼 수 있습니다.
   열쇠번호는 코드와 따로 카톡으로 알려주므로, 코드만 새어 나가면 열리지 않습니다.

   브라우저에 원래 들어 있는 잠금 기능(AES-GCM)을 씁니다.
   열쇠번호를 20만 번 반복해 늘려 두기 때문에, 숫자를 하나씩 넣어보는 방법도 매우 느립니다.
   ========================================================= */
var LOCK_ROUNDS = 200000;
function hasCrypto(){
  return !!(window.crypto && window.crypto.subtle && window.crypto.getRandomValues);
}
/* 열쇠번호를 진짜 열쇠로 바꿉니다. salt 는 매번 달라지는 소금 같은 값입니다. */
function makeKey(pin, salt, use){
  var raw = new TextEncoder().encode("길:" + String(pin));
  return crypto.subtle.importKey("raw", raw, "PBKDF2", false, ["deriveKey"])
    .then(function(base){
      return crypto.subtle.deriveKey(
        { name:"PBKDF2", salt:salt, iterations:LOCK_ROUNDS, hash:"SHA-256" },
        base, { name:"AES-GCM", length:256 }, false, use);
    });
}
function lockBytes(flag, bytes, pin){
  var salt = crypto.getRandomValues(new Uint8Array(16));
  var iv   = crypto.getRandomValues(new Uint8Array(12));
  var body = new Uint8Array(1 + bytes.length);
  body[0] = flag.charCodeAt(0);              // 줄였는지 여부도 함께 잠급니다
  body.set(bytes, 1);
  return makeKey(pin, salt, ["encrypt"]).then(function(k){
    return crypto.subtle.encrypt({ name:"AES-GCM", iv:iv }, k, body);
  }).then(function(buf){
    var enc = new Uint8Array(buf);
    var out = new Uint8Array(16 + 12 + enc.length);
    out.set(salt, 0); out.set(iv, 16); out.set(enc, 28);
    return "k" + b64url(out);
  });
}
function unlockBytes(all, pin){
  if(all.length < 29) return Promise.resolve(null);
  var salt = all.slice(0, 16), iv = all.slice(16, 28), data = all.slice(28);
  return makeKey(pin, salt, ["decrypt"]).then(function(k){
    return crypto.subtle.decrypt({ name:"AES-GCM", iv:iv }, k, data);
  }).then(function(buf){
    var u8 = new Uint8Array(buf);
    return unsqueeze(String.fromCharCode(u8[0]), u8.slice(1));
  }).catch(function(){ return null; });     // 열쇠번호가 틀리면 여기로 옵니다
}

/* =========================================================
   운영실 자물쇠

   왜 필요한가:
   사이트가 공개라 주소만 알면 누구나 들어옵니다.
   운영실에는 장부와 열쇠번호가 들어 있어서 남이 보면 안 됩니다.

   비밀번호를 코드에 그대로 적으면 안 됩니다. 저장소가 공개라 다 보입니다.
   그래서 비밀번호를 20만 번 되섞은 '잠금값'만 적어 둡니다.
   잠금값을 봐도 원래 비밀번호는 알 수 없고, 하나씩 넣어보는 것도 매우 느립니다.

   잠금값 모양 : v1:소금:되섞은값
   ========================================================= */
/* 이 줄이 채워져 있으면 모든 기기에서 같은 비밀번호를 씁니다.
   비밀번호를 바꾸려면 운영실 → 비밀번호 에서 새로 정하고,
   화면에 나오는 새 줄로 이 줄을 통째로 갈아 끼우면 됩니다. */
var OP_LOCK = "v1:xIEUizW609TpAh_ad_g7oA:UG6goFWKlyYpBQv-PMzDwRli3q4ChgS9BSOpyLzHz8Y";
var OKEY  = "gil.oplock";      // 이 컴퓨터에만 저장해 둔 잠금값
var OSKEY = "gil.opopen";      // 이 브라우저에서 이미 문을 열었는지

/* 지금 쓰이는 잠금값. 파일에 적힌 것이 언제나 우선입니다. */
function currentLock(){
  if(OP_LOCK) return OP_LOCK;
  try{ return localStorage.getItem(OKEY) || ""; }catch(e){ return ""; }
}
function hasLock(){ return !!currentLock(); }

/* 비밀번호를 되섞습니다. 결과 잠금과 같은 방식이되 소금 문구만 다릅니다. */
function lockBits(pw, salt){
  var raw = new TextEncoder().encode("길자물쇠:" + String(pw));
  return crypto.subtle.importKey("raw", raw, "PBKDF2", false, ["deriveBits"])
    .then(function(base){
      return crypto.subtle.deriveBits(
        { name:"PBKDF2", salt:salt, iterations:LOCK_ROUNDS, hash:"SHA-256" }, base, 256);
    })
    .then(function(b){ return new Uint8Array(b); });
}
/* 새 잠금값 만들기 */
function makeLock(pw){
  if(!hasCrypto()) return Promise.resolve("");
  var salt = crypto.getRandomValues(new Uint8Array(16));
  return lockBits(pw, salt).then(function(bits){
    return "v1:" + b64url(salt) + ":" + b64url(bits);
  });
}
/* 넣은 비밀번호가 잠금값과 맞는지 봅니다 */
function checkLock(pw, lock){
  if(!hasCrypto()) return Promise.resolve(false);
  var p = String(lock || "").split(":");
  if(p.length !== 3 || p[0] !== "v1") return Promise.resolve(false);
  var salt, want;
  try{ salt = unb64url(p[1]); want = unb64url(p[2]); }catch(e){ return Promise.resolve(false); }
  return lockBits(pw, salt).then(function(got){
    if(got.length !== want.length) return false;
    /* 한 글자씩 끝까지 비교합니다. 중간에 멈추면 걸리는 시간으로 눈치챌 수 있습니다. */
    var diff = 0;
    for(var i=0;i<got.length;i++) diff |= (got[i] ^ want[i]);
    return diff === 0;
  }).catch(function(){ return false; });
}
/* 문을 열어 둔 상태 — 브라우저를 닫으면 사라집니다 */
function isOpened(){
  try{ return sessionStorage.getItem(OSKEY) === "1"; }catch(e){ return false; }
}
function setOpened(v){
  try{ v ? sessionStorage.setItem(OSKEY,"1") : sessionStorage.removeItem(OSKEY); }catch(e){}
}
/* 운영실로 들어갈 때 어느 화면부터 보여줄지 정합니다 */
function opEntry(){
  if(!hasLock()) return "opNew";      // 아직 비밀번호를 안 정했다
  if(isOpened())  return "opSheet";   // 이미 이 브라우저에서 열었다
  return "opGate";                    // 비밀번호를 물어본다
}

/* 열쇠번호 4자리를 새로 뽑습니다. 0으로 시작하지 않게 1000~9999 사이로 만듭니다. */
function newPin(){
  if(hasCrypto()){
    var a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return String(1000 + (a[0] % 9000));
  }
  return String(1000 + Math.floor(Math.random() * 9000));
}

/* pin 을 주면 잠근 코드("k..."), 안 주면 예전처럼 그냥 코드("z.../p...")를 만듭니다. */
function pack(obj, pin){
  return squeeze(obj).then(function(r){
    if(pin && hasCrypto()) return lockBytes(r.flag, r.bytes, pin);
    return r.flag + b64url(r.bytes);
  });
}
/* 붙여넣은 글에서 코드 덩어리만 골라냅니다.
   카톡 안내문까지 통째로 붙여넣는 일이 아주 흔하기 때문입니다. */
function pickCode(text){
  var s = String(text || "").trim();
  var i = s.lastIndexOf("#r=");            // 링크를 통째로 붙여넣어도 읽어냅니다
  if(i >= 0) s = s.slice(i + 3);
  s = s.replace(/\s+/g,"");                // 줄바꿈·띄어쓰기는 지웁니다
  if(/^[zpk][A-Za-z0-9_-]+$/.test(s)) return s;
  var found = s.match(/[zpk][A-Za-z0-9_-]{40,}/g);
  if(!found) return "";
  return found.sort(function(a,b){ return b.length - a.length; })[0];
}
/* 잠긴 코드인지(열쇠번호가 필요한지) 미리 알아봅니다 */
function isLocked(text){ return pickCode(text).charAt(0) === "k"; }

/* 결과를 돌려주거나, 못 열면 왜 못 열었는지 알려줍니다.
   { ok:결과 } 또는 { need:"pin" } 또는 { bad:"pin" } 또는 { bad:"code" } */
function unpack(text, pin){
  var s = pickCode(text);
  if(!s) return Promise.resolve({ bad:"code" });
  var kind = s.charAt(0), bytes;
  try{ bytes = unb64url(s.slice(1)); }catch(e){ return Promise.resolve({ bad:"code" }); }

  if(kind === "k"){
    if(!hasCrypto()) return Promise.resolve({ bad:"code" });
    if(!pin) return Promise.resolve({ need:"pin" });
    return unlockBytes(bytes, pin).then(function(o){
      return (o && o.storyboard) ? { ok:o } : { bad:"pin" };
    });
  }
  return unsqueeze(kind, bytes).then(function(o){
    return (o && o.storyboard) ? { ok:o } : { bad:"code" };
  });
}

   ========================================================= */
function h(tag, attrs, kids){
  var e = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    if(k === "text") e.textContent = attrs[k];
    else if(k === "cls") e.className = attrs[k];
    else if(k === "on") Object.keys(attrs.on).forEach(function(ev){ e.addEventListener(ev, attrs.on[ev]); });
    /* aria- 로 시작하는 것은 "true" / "false" 라는 글자를 그대로 넣어야 합니다.
       빈 값으로 넣으면 화면 꾸미는 규칙([aria-pressed="true"])과 안 맞아
       눌러도 선택 표시가 나지 않습니다. */
    else if(k.indexOf("aria-") === 0){ if(attrs[k] != null) e.setAttribute(k, String(attrs[k])); }
    else if(attrs[k] === true) e.setAttribute(k,"");
    else if(attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function(c){ if(c) e.appendChild(c); });
  return e;
}
function eyebrow(x){ return h("div",{cls:"eyebrow",text:x}); }

function copyText(str){
  var ta = document.createElement("textarea");
  ta.value = str; ta.style.position = "fixed"; ta.style.top = "-1000px";
  document.body.appendChild(ta); ta.select();
  var ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{ navigator.clipboard.writeText(str); ok = true; }catch(e){}
  }
  return ok;
}
function flash(btn, msg, back, cls){
  var old = btn.className;
  btn.className = old + " " + (cls || "done"); btn.textContent = msg;
  setTimeout(function(){ btn.className = old; btn.textContent = back; }, 2400);
}
function go(scr){ S.screen = scr; S.err = ""; render(); window.scrollTo(0,0); }

function saveText(filename, text, btn){
  var back = btn ? btn.textContent : "";
  if(window.claude && window.claude.downloads){
    window.claude.downloads.save({ filename:filename, data:text })
      .then(function(){ if(btn) flash(btn, t("saved"), back); })
      .catch(function(err){
        if(err && err.code === "declined") return;
        if(btn) flash(btn, t("errSave"), back);
      });
    return;
  }
  var blob = new Blob([text], { type:"text/plain;charset=utf-8" });
  var u = URL.createObjectURL(blob);
  var a = h("a",{ href:u, download:filename });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(u); }, 1000);
  if(btn) flash(btn, t("saved"), back);
}

  if(r.hashtags.length) L.push(W.tags + r.hashtags.join(" "));
  if(r.cta) L.push(W.cta + r.cta);
  return L.join("\n");
}

SCREENS.opGate = function(app){
  var pw = h("input",{type:"password",placeholder:t("gatePh"),
    on:{input:function(e){ S.opPw = e.target.value; },
        keydown:function(e){ if(e.key === "Enter") tryOpen(); }}});
  pw.value = S.opPw;

  var btn = h("button",{cls:"btn",text:t("gateOpen")});
  var tryOpen = function(){
    if(S.opBusy) return;
    if(!S.opPw){ S.err = t("gateEmpty"); render(); return; }
    /* 되섞는 데 잠깐 걸립니다. 누른 티를 내야 두 번 누르지 않습니다. */
    S.opBusy = true; btn.disabled = true; btn.textContent = t("gateChecking");
    checkLock(S.opPw, currentLock()).then(function(ok){
      S.opBusy = false;
      if(ok){ setOpened(true); S.opPw = ""; S.opTries = 0; go("opSheet"); return; }
      S.opTries = (S.opTries || 0) + 1;
      S.err = t("gateWrong");
      render();

  app.appendChild(h("div",{style:"padding-top:118px"},[
    eyebrow(t("op")),

    S.opTries >= 3 ? h("p",{cls:"note",style:"margin-top:8px",text:t("gateHint")}) : null,

    h("div",{cls:"stack",style:"margin-top:16px"},[
      mkBtn,
      h("button",{cls:"ghost",text:t("back"),on:{click:function(){

/* ---------- 운영실 : 장부 ----------

   여기 있는 것: 언제 · 어느 가게 · 납기 · 열쇠번호 · 결과 코드
   사장님이 "번호를 잃어버렸다"고 하시면 이 화면에서 찾아 다시 알려드립니다.
   ------------------------------------- */
SCREENS.opLedger = function(app){
  var list = loadLedger();

  /* 백업할 내용을 한 번만 만들어 두고 두 가지 길에 씁니다 */
  var now = new Date();
  var backupText = JSON.stringify(
    { 종류:"길 장부", 만든날:now.toISOString(), 건수:list.length, 목록:list }, null, 2);
  var backupName = "길-장부-" + now.getFullYear() + "-" +
                   ("0" + (now.getMonth()+1)).slice(-2) + "-" +
                   ("0" + now.getDate()).slice(-2) + ".json";

  /* 길 ①: 파일로 내려받기.
     액자 안에서는 내려받기가 막히거나, 받아도 어디 갔는지 못 찾는 일이 있습니다.
     그래서 이 버튼만 두지 않고 아래에 글로 복사하는 길을 반드시 함께 둡니다. */
  var dl = h("button",{cls:"btn",text:t("bkDownload"),on:{click:function(){
    if(!list.length){ S.ledgerMsg = t("bkEmpty"); render(); return; }
    saveText(backupName, backupText, dl);
    S.ledgerMsg = t("bkWhere");
    S.showBackup = true;
    render();
  }}});

  /* 길 ②: 글로 복사해서 메모장에 붙여넣기. 이건 어디서나 반드시 됩니다. */
  var showBtn = h("button",{cls:"ghost",text:S.showBackup ? t("bkHide") : t("bkShow"),
    on:{click:function(){ S.showBackup = !S.showBackup; render(); }}});

  var backupBox = null, copyBackup = null;
  if(S.showBackup){
    backupBox = h("textarea",{rows:7,cls:"mono",readonly:true});
    backupBox.value = backupText;
    copyBackup = h("button",{cls:"btn",text:t("bkCopy"),on:{click:function(){
      if(copyText(backupText)) flash(copyBackup, t("copied"), t("bkCopy"));
      else { backupBox.focus(); backupBox.select(); flash(copyBackup, t("copyManual"), t("bkCopy")); }
    }}});
  }

  /* 백업 되살리기 — 파일을 고르는 방법과, 글을 붙여넣는 방법 둘 다 둡니다.
     액자 안에서는 파일 고르기가 막힐 수 있어 붙여넣기 길을 꼭 남겨 둡니다. */
  var file = h("input",{type:"file",accept:".json,application/json",
    style:"width:100%; font-size:13px; color:var(--mute);",
    on:{change:function(e){
      var f = e.target.files && e.target.files[0];
      if(!f) return;
      var rd = new FileReader();
      rd.onload = function(){ takeBackup(String(rd.result)); };
      rd.onerror = function(){ S.ledgerMsg = t("bkFileFail"); render(); };
      rd.readAsText(f);
    }}});

  var pasteBox = h("textarea",{rows:4,placeholder:t("bkPastePh"),
    on:{input:function(e){ S.restore = e.target.value; }}});
  pasteBox.value = S.restore;

  var takeBackup = function(text){
    var data;
    try{ data = JSON.parse(text); }catch(e){
      S.ledgerMsg = t("bkUnread"); render(); return;
    }
    var arr = Array.isArray(data) ? data : (data && Array.isArray(data.목록) ? data.목록 : null);
    if(!arr){ S.ledgerMsg = t("bkNotOurs"); render(); return; }
    var added = mergeLedger(arr);
    if(added < 0) S.ledgerMsg = t("bkFull");
    else if(added === 0) S.ledgerMsg = t("bkSame");
    else S.ledgerMsg = tf("bkAdded", { n:added });
    S.restore = "";
    render();
  };

  var rbtn = h("button",{cls:"ghost",text:t("bkRestoreBtn"),on:{click:function(){
    if(!S.restore.trim()){ S.ledgerMsg = t("bkNothing"); render(); return; }
    takeBackup(S.restore);
  }}});

  /* 한 건을 그리는 상자 */
  var card = function(x){
    var due = tierLabel(x.tier);
    var codeBtn = h("button",{cls:"ghost mini",text:t("copyCode"),on:{click:function(){
      if(copyText(x.code)) flash(codeBtn, t("copied"), t("copyCode"));
    }}});
    var againBtn = h("button",{cls:"ghost mini",text:t("againSend"),on:{click:function(){
      if(copyText(sendMsg(t("againMsg"), x.code, x.pin))) flash(againBtn, t("copied"), t("againSend"));
    }}});
    var openBtn = h("button",{cls:"ghost mini",text:t("openIt"),on:{click:function(){
      unpack(x.code, x.pin).then(function(r){
        if(r.ok){ S.result = r.ok; S.tab = "plan"; go("done"); }
        else { S.ledgerMsg = t("openFail"); render(); }
      });
    }}});
    var delBtn = h("button",{cls:"tiny",text:t("del"),on:{click:function(){
      /* 되돌릴 수 없으므로 한 번 더 누르게 합니다 (경고창은 화면을 멈추게 하므로 쓰지 않습니다) */
      if(delBtn.dataset.sure === "1"){
        removeLedger(x.id); S.ledgerMsg = t("delDone"); render(); return;
      }
      delBtn.dataset.sure = "1";
      delBtn.textContent = t("delSure");
      setTimeout(function(){
        if(delBtn.isConnected){ delBtn.dataset.sure = ""; delBtn.textContent = t("del"); }
      }, 4000);
    }}});

    return h("div",{cls:"card stack"},[
      h("div",{cls:"row",style:"justify-content:space-between; align-items:baseline"},[
        h("span",{cls:"eyebrow",text:whenText(x.at)}),
        h("span",{cls:"eyebrow",text:due + " · " + lenLabel(x.sec)})
      ]),
      h("div",{cls:"disp",style:"font-size:17px",text:x.name || x.who || t("noName")}),
      x.who ? h("div",{cls:"note",style:"margin:0",text:t("contactIs") + " " + x.who}) : null,
      x.brief ? h("div",{cls:"note",style:"margin:0",text:x.brief}) : null,
      x.pin ? h("div",{cls:"copyrow"},[
        h("span",{cls:"eyebrow",text:t("keyNo")}),
        h("span",{cls:"copyval",style:"font-size:20px; letter-spacing:.3em; color:var(--accent-ink); font-weight:800",
                  text:x.pin})
      ]) : h("div",{cls:"note",style:"margin:0",text:t("noLock")}),
      h("div",{cls:"row"},[ againBtn, codeBtn, openBtn, delBtn ])
    ]);
  };

  app.appendChild(h("div",{style:"padding-top:78px"},[
    opBar(),
    eyebrow(t("ledger")),
    h("h2",{cls:"disp h2",style:"font-size:22px",
            text:list.length ? tf("ledgerCount", { n:list.length }) : t("ledgerNone")}),
    h("p",{cls:"note",style:"margin-top:6px",text:t("ledgerWhat")}),

    S.ledgerMsg ? h("p",{cls:"okmsg",style:"margin-top:12px",text:S.ledgerMsg}) : null,

    h("div",{style:"margin-top:22px"},[ eyebrow(t("bkTitle")) ]),
    h("div",{cls:"card stack",style:"margin-top:10px"},[
      dl,
      showBtn,
      backupBox,
      copyBackup,
      /* 파일이 안 만들어질 때가 있어서, 글로 저장하는 법을 적어 둡니다 */
      S.showBackup ? h("p",{cls:"note",style:"margin:0",text:t("bkHow")}) : null
    ]),

    h("div",{style:"margin-top:26px"},[ eyebrow(t("bkRestore")) ]),
    h("div",{cls:"card stack",style:"margin-top:10px"},[
      h("div",{cls:"note",style:"margin:0",text:t("bkPickFile")}),
      file,
      pasteBox,
      rbtn
    ]),

    h("div",{style:"margin-top:26px"},[ eyebrow(t("ledgerItems")) ]),
    h("div",{cls:"stack",style:"margin-top:10px"},
      list.length ? list.map(card)
                  : [ h("div",{cls:"card"},[ h("p",{cls:"note",style:"margin:0",
                      text:t("ledgerEmptyHint")}) ]) ]),

    h("button",{cls:"ghost",style:"margin-top:22px",text:t("back"),
                on:{click:function(){ go("opSheet"); }}})
  ]));
};

/* 사장님에게 "어디로 보내야 하는지" 보여주는 상자.
   비어 있는 항목은 아예 그리지 않습니다.
   링크가 막히는 곳에서도 쓸 수 있게, 항상 복사 버튼을 함께 둡니다. */
function contactBlock(){
  if(!hasContact()){
    return h("div",{cls:"card",style:"margin-top:10px"},[
      h("p",{cls:"warn",style:"margin:0",text:t("noContact")})
    ]);
  }
  var rows = [];
  var en = S.lang === "en";
  var ig = igUser(C.instagram);

  /* 한 칸씩 그리는 작은 도구들 — 순서만 바꿔 끼우면 되게 나눠 둡니다 */
  var kakaoRows = function(main){
    if(!C.kakaoOpen) return;
    rows.push(h("a",{cls:(main ? "btn" : "ghost") + " linkbtn",href:C.kakaoOpen,target:"_blank",
                     rel:"noopener noreferrer",text:t("goKakao")}));
    rows.push(copyRow("", C.kakaoOpen));
    /* 가게 사정을 적어 보내는 일이라, 누가 보는지가 사장님께 제일 큰 걱정입니다.
       보내기 직전에 그 걱정을 없애 줍니다. 링크 종류에 맞는 말로 적습니다. */
    rows.push(h("p",{cls:"note",style:"margin:2px 0 0",
      text:kakaoKind(C.kakaoOpen) === "open" ? t("privOpen") : t("privChannel")}));
  };
  var idRow = function(){
    if(!C.kakaoId) return;
    rows.push(h("div",{cls:"eyebrow",style:"margin-top:6px",text:t("kakaoIdLabel")}));
    rows.push(copyRow("", C.kakaoId));
  };
  var phoneRow = function(){
    if(!C.phone) return;
    rows.push(h("div",{cls:"eyebrow",style:"margin-top:6px",text:t("phoneLabel")}));
    rows.push(h("a",{cls:"ghost linkbtn",href:"sms:" + C.phone.replace(/[^0-9+]/g,""),
                     text:t("sendSms")}));
    rows.push(copyRow("", C.phone));
  };
  var mailRow = function(main){
    if(!C.email) return;
    rows.push(h("div",{cls:"eyebrow",style:"margin-top:6px",text:t("emailLabel")}));
    rows.push(h("a",{cls:(main ? "btn" : "ghost") + " linkbtn",href:"mailto:" + C.email,
                     text:t("sendMail")}));
    rows.push(copyRow("", C.email));
  };
  var igRow = function(main){
    if(!ig) return;
    rows.push(h("div",{cls:"eyebrow",style:"margin-top:6px",text:t("igLabel")}));
    rows.push(h("a",{cls:(main ? "btn" : "ghost") + " linkbtn",
                     href:"https://ig.me/m/" + ig,target:"_blank",
                     rel:"noopener noreferrer",text:t("sendIg")}));
    rows.push(copyRow("", "@" + ig));
  };

  if(en){
    /* 외국인 사장님은 카카오톡을 안 쓰는 경우가 많습니다.
       이메일과 인스타그램을 앞에 두고, 카카오톡은 '쓰신다면' 정도로 뒤에 둡니다. */
    mailRow(true);
    igRow(!C.email);
    if(C.kakaoOpen || C.kakaoId){
      rows.push(h("div",{cls:"eyebrow",style:"margin-top:14px",text:t("alsoKakao")}));
      kakaoRows(false);
      idRow();
    }
  }else{
    kakaoRows(true);
    idRow();
    phoneRow();
    mailRow(false);
    igRow(false);
  }
  return h("div",{cls:"card stack",style:"margin-top:10px"}, rows);
}

/* ---------- 운영실 3 : 답 붙여넣기 ---------- */
SCREENS.opPaste = function(app){
  var ta = h("textarea",{rows:12,placeholder:t("phAns"),
    on:{input:function(e){ S.raw = e.target.value; }}});
  ta.value = S.raw;
  app.appendChild(h("div",{style:"padding-top:78px"},[
    opBar(),
    eyebrow(t("op3")),
    h("h2",{cls:"disp h2",style:"font-size:22px",text:t("op3sub")}),
    h("div",{style:"margin-top:14px"},[ ta ]),
    S.err ? h("p",{cls:"warn",style:"margin-top:12px",text:S.err}) : null,
    h("div",{cls:"stack",style:"margin-top:16px"},[
      h("button",{cls:"btn",text:t("makeLink"),on:{click:function(){
        var r = parseResult(S.raw);
        if(!r){ S.err = t("errParse"); render(); return; }
        S.result = r;
        /* 결과를 만들 때마다 열쇠번호를 새로 뽑아 잠급니다.
           코드가 새어 나가도 이 번호를 모르면 열리지 않습니다. */
        S.pin = hasCrypto() ? newPin() : "";
        pack(r, S.pin).then(function(code){
          S.code = code;
          /* 바탕 주소를 못 정하면(액자 안 등) 링크는 만들지 않습니다.
             엉뚱한 주소를 보내면 사장님 화면에 에러가 뜨기 때문입니다. */
          var base = siteBase();
          S.link = base ? (base + "#r=" + code) : "";

          /* 장부에 적어 둡니다. 열쇠번호를 나중에 다시 알려드리려면 이게 있어야 합니다. */
          var q = S.req || {};
          S.ledgerOk = addLedger({
            id   : newId(),
            at   : Date.now(),
            who  : q.who || "",
            tier : q.tier || "",
            sec  : q.sec || "",
            brief: String(q.brief || "").slice(0, 120),
            name : r.brandLine || "",
            pin  : S.pin,
            code : code
          });
          go("opSend");
        });
      }}}),
      h("button",{cls:"ghost",text:t("back"),on:{click:function(){ go("opPrompt"); }}})
    ])
  ]));
};

/* ---------- 운영실 4 : 사장님께 보내기 ----------

   보내는 길이 두 갈래입니다.

   [바로 읽기]  결과 전문을 카톡 글로 그대로 보냅니다.
                사장님은 아무것도 누르지 않고 카톡에서 바로 읽습니다.
                단계가 0입니다. 대부분 이걸 쓰면 됩니다.

   [예쁜 화면]  결과 코드 + 열쇠번호를 보냅니다.
                사장님이 사이트에서 다섯 칸으로 나뉜 화면을 봅니다.
                탭으로 나뉘어 있어 촬영장에서 보기 좋습니다.
   --------------------------------------------------------- */
SCREENS.opSend = function(app){
  var hasLink = !!S.link;
  var long = hasLink && S.link.length > 1800;
  var locked = !!S.pin;

  var head = S.lang === "en"
    ? "Your ad video plan is ready."
    : "사장님, 광고 영상 제작안 다 됐습니다.";
  var tail = S.lang === "en"
    ? "\n\nTell me anything you want changed."
    : "\n\n고치고 싶은 데 있으면 편하게 말씀해 주세요.";

  /* ① 바로 읽는 글 — 결과 전문을 카톡에 그대로 붙여넣습니다 */
  var plain = head + "\n\n" + resultToText(S.result) + tail;

  /* ② 예쁜 화면으로 보내는 글 — 코드와 열쇠번호를 함께 담습니다 */
  var guide = sendMsg(head, S.code, S.pin);

  var pbtn = h("button",{cls:"btn",text:t("copyDirect"),on:{click:function(){
    if(copyText(plain)) flash(pbtn, t("copied"), t("copyDirect"));
    else flash(pbtn, t("copyFail"), t("copyDirect"), "");
  }}});
  var gbtn = h("button",{cls:"ghost",text:t("copyPretty"),on:{click:function(){
    if(copyText(guide)) flash(gbtn, t("copied"), t("copyPretty"));
  }}});

  var rows = [ pbtn, gbtn ];
  if(hasLink){
    var lbtn = h("button",{cls:"ghost",text:t("copyLink"),on:{click:function(){
      if(copyText(S.link)) flash(lbtn, t("copied"), t("copyLink"));
    }}});
    rows.push(lbtn);
  }
  rows.push(h("button",{cls:"ghost",text:t("preview"),on:{click:function(){ S.tab = "plan"; go("done"); }}}));
  rows.push(h("button",{cls:"ghost",text:t("back"),on:{click:function(){ go("opPaste"); }}}));

  /* 열쇠번호는 크게 보여줍니다. 카톡에 옮겨 적을 때 잘못 보면 사장님이 못 엽니다. */
  var pinCard = locked ? h("div",{cls:"card stack",style:"margin-top:14px"},[
    h("div",{cls:"eyebrow",text:t("thisPin")}),
    h("div",{cls:"plate",style:"letter-spacing:.22em",text:S.pin}),
    h("p",{cls:"note",style:"margin:0",text:t("pinWhy")}),
    /* 장부에 적혔는지 여기서 바로 알려 줍니다.
       못 적혔는데 모르고 지나가면 열쇠번호를 영영 잃습니다. */
    S.ledgerOk
      ? h("p",{cls:"okmsg",style:"margin:0",text:t("pinSaved")})
      : h("p",{cls:"warn",style:"margin:0",text:t("pinNotSaved")})
  ]) : null;

  app.appendChild(h("div",{style:"padding-top:78px"},[
    opBar(),
    eyebrow(t("op4")),
    h("h2",{cls:"disp h2",style:"font-size:22px",text:t("twoWays")}),

    /* 어느 쪽을 쓸지 한눈에 고르게 합니다 */
    h("div",{cls:"card",style:"margin-top:14px"},[
      h("div",{cls:"step"},[
        h("span",{cls:"num",text:"1"}),
        h("span",{},[
          h("div",{style:"font-weight:800",text:t("way1")}),
          h("div",{cls:"note",style:"margin-top:2px",text:t("way1sub")})
        ])
      ]),
      h("div",{cls:"step"},[
        h("span",{cls:"num",text:"2"}),
        h("span",{},[
          h("div",{style:"font-weight:800",text:t("way2")}),
          h("div",{cls:"note",style:"margin-top:2px",text:t("way2sub")})
        ])
      ])
    ]),

    pinCard,

    h("div",{cls:"card",style:"margin-top:14px"},[
      h("div",{cls:"note",text:tf("sizeNote", { a:plain.length, b:S.code.length })})
    ]),
    long ? h("p",{cls:"warn",style:"margin-top:12px",text:t("linkLong")}) : null,
    h("div",{cls:"stack",style:"margin-top:14px"}, rows)
  ]));
};

/* ---------- 결과 5탭 ---------- */
SCREENS.done = function(app){
  var r = S.result;
  var tabs = [["plan",t("tabPlan")],["script",t("tabScript")],["caption",t("tabCaption")],
              ["shot",t("tabShot")],["edit",t("tabEdit")]];
  var bar = h("div",{cls:"tabs",role:"tablist"}, tabs.map(function(x){
    return h("button",{role:"tab","aria-selected":S.tab === x[0],text:x[1],
      on:{click:function(){ S.tab = x[0]; render(); }}});
  }));
  var body = h("div",{style:"margin-top:20px"});
  ({ plan:paneP, script:paneS, caption:paneC, shot:paneT, edit:paneE })[S.tab](body, r);

  app.appendChild(h("div",{style:"padding-top:86px"},[
    h("div",{cls:"plate",style:"margin-bottom:16px",text:"길"}),
    h("p",{cls:"lead",style:"margin-bottom:22px",text:r.brandLine}),
    bar, body,
    h("div",{cls:"stack",style:"margin-top:30px"},[
      h("button",{cls:"ghost",text:t("download"),on:{click:function(e){
        saveText("길-제작안.txt", resultToText(r), e.target);
      }}}),
      h("button",{cls:"ghost",text:t("back"),on:{click:function(){
        go(S.req ? "opSend" : "intro");
      }}})
    ])
  ]));
};

function paneP(box, r){
  box.appendChild(eyebrow(t("headlines")));
  box.appendChild(h("div",{cls:"card",style:"margin-top:10px"}, r.headlines.map(function(x,i){
    return h("div",{style:"padding:10px 0;" + (i ? "border-top:1px dashed var(--edge)" : "")},[
      h("span",{cls:"num",text:"0" + (i+1)}),
      h("div",{cls:"disp",style:"font-size:21px;margin-top:4px",text:x})
    ]);
  })));
  if(r.hashtags.length){
    box.appendChild(h("div",{style:"margin-top:26px"},[ eyebrow(t("tags")) ]));
    box.appendChild(h("div",{style:"margin-top:10px"},
      r.hashtags.map(function(x){ return h("span",{cls:"tag",text:x}); })));
  }
  if(r.cta){
    box.appendChild(h("div",{style:"margin-top:26px"},[ eyebrow(t("cta")) ]));
    box.appendChild(h("div",{cls:"disp",style:"font-size:23px;margin-top:8px;color:var(--accent-ink)",text:r.cta}));
  }
}
function paneS(box, r){
  box.appendChild(h("div",{cls:"card"}, r.storyboard.map(function(c){
    return h("div",{cls:"cut"},[
      h("span",{cls:"time",text:c.time}),
      h("span",{},[
        h("div",{cls:"visual",text:c.visual}),
        c.shot    ? h("div",{cls:"shot",text:t("lblShot") + " · " + c.shot}) : null,
        c.caption ? h("div",{cls:"capt",text:t("lblCapt") + " · " + c.caption}) : null,
        c.voice   ? h("div",{cls:"voice",text:t("lblVoice") + " · " + c.voice}) : null
      ])
    ]);
  })));
}
function paneC(box, r){
  var caps = r.storyboard.map(function(c){ return c.caption; }).filter(Boolean);
  box.appendChild(h("div",{cls:"card"}, caps.map(function(x,i){
    return h("div",{cls:"step"},[
      h("span",{cls:"num",text:String(i+1)}),
      h("span",{cls:"disp",style:"font-size:17px",text:x})
    ]);
  })));
  var b = h("button",{cls:"ghost",style:"margin-top:12px",text:t("captionAll"),
    on:{click:function(){ if(copyText(caps.join("\n"))) flash(b, t("copied"), t("captionAll")); }}});
  box.appendChild(b);
}
function paneT(box, r){
  box.appendChild(h("div",{cls:"card"}, r.storyboard.map(function(c,i){
    return h("div",{cls:"cut"},[
      h("span",{cls:"time",text:t("lblCut") + " " + (i+1)}),
      h("span",{},[
        h("div",{cls:"visual",text:c.visual}),
        c.shot ? h("div",{cls:"shot",text:c.shot}) : null
      ])
    ]);
  })));
  if(r.props.length){
    box.appendChild(h("div",{style:"margin-top:26px"},[ eyebrow(t("props")) ]));
    box.appendChild(h("div",{style:"margin-top:10px"},
      r.props.map(function(x){ return h("span",{cls:"tag",text:x}); })));
  }
  if(r.shootTips.length){
    box.appendChild(h("div",{style:"margin-top:26px"},[ eyebrow(t("tips")) ]));
    box.appendChild(h("div",{cls:"card",style:"margin-top:10px"}, r.shootTips.map(function(x,i){
      return h("div",{cls:"step"},[ h("span",{cls:"num",text:String(i+1)}), h("span",{text:x}) ]);
    })));
  }
}
function paneE(box, r){
  [["capcut",t("capcut")],["vllo",t("vllo")]].forEach(function(p,idx){
    var list = r.edit[p[0]];
    if(!list.length) return;
    box.appendChild(h("div",{style:idx ? "margin-top:26px" : ""},[ eyebrow(p[1]) ]));
    box.appendChild(h("div",{cls:"card",style:"margin-top:10px"}, list.map(function(x,i){
      return h("div",{cls:"step"},[ h("span",{cls:"num",text:String(i+1)}), h("span",{text:x}) ]);
    })));
  });
}

/* =========================================================
   8) 시작 — 링크에 결과가 들어 있으면 바로 펼친다
   ========================================================= */
document.getElementById("langKo").addEventListener("click", function(){ S.lang = "ko"; saveLang(); render(); });
document.getElementById("langEn").addEventListener("click", function(){ S.lang = "en"; saveLang(); render(); });

(function boot(){
  /* 지난번에 고른 말로 엽니다. 처음 오신 분은 브라우저 말을 따릅니다. */
  S.lang = loadLang();
  try{ document.documentElement.lang = S.lang; }catch(e){}

  var hash = "";
  try{ hash = location.hash || ""; }catch(e){}
  if(hash.indexOf("#r=") === 0){
    /* 잠긴 결과라면 열쇠번호를 받아야 하므로 결과 여는 화면으로 데려갑니다. */
    S.code = hash;
    if(isLocked(hash)){
      S.askPin = true; S.screen = "openCode"; render(); return;
    }
    unpack(hash).then(function(r){
      if(r.ok){ S.result = r.ok; S.tab = "plan"; S.screen = "done"; }
      else { S.screen = "openCode"; S.err = t("errCode"); }
      render();
    });
    render();
    return;
  }
  render();
})();
</script>
